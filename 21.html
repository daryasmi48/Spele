<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoku mednieks</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #f1f5f9; color: #222222; }
h1 { color: #912433; }
.noteikumi { background-color: #f8d4e2; padding: 12px; border-radius: 12px;}
button { background-color: #d397a9; color: #0a0a0a; border: 0; }
</style>
</head>
<body>
<h1>Spoku mednieks</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Spēlētājam ir 3 dzīvības.
  <p>Spēle ilgst 60 sekundes.</p>
  <p>Spēlētājam jānoķer vismaz 5 spoki, taču nedrīkst zaudēt visas dzīvības.</p> 
</section>
<button>Sākt spēli</button>
</body>
</html>
