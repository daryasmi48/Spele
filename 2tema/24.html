<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoku mednieks</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* MAINI ŠEIT: skaņas bloku izskats */
.skana {
  background-color: #f5e3ee;
  border: 2px solid #7c2345;
  border-radius: 12px;
  padding: 16px;
  margin: 16px 0;
  box-sizing: border-box;
}
</style>
</head>
<body>
<h1>Spoku mednieks</h1>
<p>Noklausies spēles skaņas efektus ar atskaņošanas pogu.</p>
<div class="skana">
  <h2>Punka iegūšana</h2>
  <p>Šo skaņu dzirdēsi, kad noķersi spoku.</p>
  <audio controls src="skanas/klikskis.wav"></audio>
</div>
<div class="skana">
  <h2>Uzvara</h2>
  <p>Šo skaņu dzirdēsi, kad gūsi uzvaru.</p>
  <audio controls src="skanas/klikskis.wav"></audio>
</div>
</body>
</html>
